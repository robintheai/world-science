<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="ws-owl state-on" role="img" aria-label="Owlpath"><title>Owlpath</title><style>
.ws-owl .owl-body{fill:#0E1838;stroke:#0E1838}.ws-owl .owl-ring{fill:#1F2C57}.ws-owl .branch{stroke:#0E1838}
.ws-owl .sky-dusk,.ws-owl .sky-day,.ws-owl .sun,.ws-owl .clouds,.ws-owl .zzz,.ws-owl .sleep-eye,.ws-owl .flash{opacity:0}
.ws-owl .sun{transform:translateY(130px)}
.ws-owl .glow-wrap{opacity:.5}
.meteor{opacity:0}
.star,.eye-state,.glance,.eye,.wink,.zz,.flash{transform-box:fill-box;transform-origin:center}
.owl-idle,.owl-hover{transform-box:view-box;transform-origin:256px 430px}
.sun,.moon,.rays{transform-box:view-box;transform-origin:256px 232px}
.state-busy .sky-dusk{opacity:1}
.state-busy .sun{opacity:0;transform:translateY(130px)}
.state-busy .moon{opacity:.92;transform:translateY(70px)}
.state-busy .st{opacity:.45}
.state-busy .eye-state{transform:scaleY(.42)}
.state-busy .glow-wrap{opacity:.25}
.state-busy .owl-body{fill:#272B5C;stroke:#272B5C}.state-busy .owl-ring{fill:#363C74}.state-busy .branch{stroke:#272B5C}
.state-off .sky-day,.state-off .sun,.state-off .clouds,.state-off .zzz,.state-off .sleep-eye{opacity:1}
.state-off .sun{transform:none}
.state-off .moon{opacity:0;transform:translateY(110px)}
.state-off .st{transform:scale(.2)}
.state-off .st,.state-off .glow-wrap,.state-off .meteor-wrap{opacity:0}
.state-off .eye-state{transform:scaleY(.06);opacity:0}
.state-off .owl-body{fill:#4D5D8C;stroke:#4D5D8C}.state-off .owl-ring{fill:#5E70A3}.state-off .branch{stroke:#6A6F86}

.st{transform-box:fill-box;transform-origin:center;transition:opacity .5s ease,transform .6s cubic-bezier(.34,1.8,.64,1)}.state-on .st{transition-delay:var(--d)}
.sky-dusk,.sky-day,.clouds,.zzz,.sleep-eye,.glow-wrap,.meteor-wrap{transition:opacity 1.2s ease}
.sun,.moon{transition:opacity 1.3s ease,transform 1.6s cubic-bezier(.22,1,.36,1)}
.owl-body,.owl-ring{transition:fill 1.4s ease,stroke 1.4s ease}.branch{transition:stroke 1.4s ease}
.eye-state{transition:transform .55s cubic-bezier(.34,1.4,.64,1) .35s,opacity .3s .35s}
.state-off .eye-state{transition:transform .9s ease-in,opacity .4s .6s}
.state-off .sleep-eye{transition:opacity .6s .7s}
.owl-hover{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
svg:hover .owl-hover{transform:rotate(7deg)}
.look{transition:transform .18s ease-out}
.state-on .eye{animation:ws-blink 7s 2.4s ease-in-out infinite}
.state-busy .eye{animation:ws-drowsy 2.6s ease-in-out infinite}
.glow{transform-box:fill-box;transform-origin:center;animation:ws-breathe 4.2s ease-in-out infinite}
.state-busy .glow{animation-duration:1.6s}
.s1{animation:ws-twinkle 3.8s .2s ease-in-out infinite}.s2{animation:ws-twinkle 4.6s 1.4s ease-in-out infinite}
.s3{animation:ws-twinkle 3.2s 2.1s ease-in-out infinite}.s4{animation:ws-twinkle 5.2s .8s ease-in-out infinite}
.s5{animation:ws-twinkle 4.1s 1.9s ease-in-out infinite}
.moon .halo{transform-box:fill-box;transform-origin:center;animation:ws-breathe 8s ease-in-out infinite}
.state-on .owl-idle{animation:ws-tilt 16s 6s ease-in-out infinite}
.state-busy .owl-idle{animation:ws-search 3.4s ease-in-out infinite}
.state-busy .glance{animation:ws-scan 3.4s ease-in-out infinite}
.state-on .glance{animation:ws-glance 11s 5s ease-in-out infinite}
.following .glance{animation:none}
.state-off .owl-idle{animation:ws-sleep 4.4s ease-in-out infinite}
.dozing .owl-idle{animation:ws-nod 1.3s .4s ease-in-out both,ws-sleep 4.4s 1.7s ease-in-out infinite}
.state-on .meteor{animation:ws-meteor 19s 4s linear infinite}
.meteor{opacity:0}
.rays{animation:ws-spin 48s linear infinite}
.cloud-a{animation:ws-drift 9s ease-in-out infinite alternate}
.cloud-b{animation:ws-drift 12s -4s ease-in-out infinite alternate-reverse}
.zz{animation:ws-zz 3.6s ease-in-out infinite both}.zz2{animation-delay:.6s}.zz3{animation-delay:1.2s}
.waking .flash{animation:ws-flash 1.1s .55s ease-out both}
.waking .owl-idle{animation:ws-hello 1s .9s ease-in-out both}
.wink.on{animation:ws-wink .42s ease-in-out}
@keyframes ws-blink{0%,38%,46%,84%,88.5%,93%,100%{transform:scaleY(1)}41.5%,86.2%,90.8%{transform:scaleY(.08)}}
@keyframes ws-drowsy{0%,100%{transform:scaleY(1)}45%,60%{transform:scaleY(.25)}}
@keyframes ws-breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.06)}}
@keyframes ws-twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.65)}}
@keyframes ws-tilt{0%,78%,97%,100%{transform:rotate(0)}82%,88%{transform:rotate(7deg)}92.5%{transform:rotate(-2deg)}}
@keyframes ws-search{0%,100%{transform:rotate(0)}22%,36%{transform:rotate(-5deg)}64%,78%{transform:rotate(5deg)}}
@keyframes ws-scan{0%,100%{transform:translateX(0)}22%,36%{transform:translateX(-5px)}64%,78%{transform:translateX(5px)}}
@keyframes ws-glance{0%,68%,94%,100%{transform:translate(0,0)}72%,78%{transform:translate(-5px,0)}83%,89%{transform:translate(5px,1px)}}
@keyframes ws-sleep{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
@keyframes ws-nod{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(12px) rotate(-3deg)}60%{transform:translateY(3px) rotate(1deg)}}
@keyframes ws-hello{0%,100%{transform:rotate(0)}35%,65%{transform:rotate(-8deg)}}
@keyframes ws-meteor{0%{opacity:0;transform:translate(0,0)}1.5%{opacity:1}6.5%{opacity:0;transform:translate(-170px,68px)}100%{opacity:0;transform:translate(-170px,68px)}}
@keyframes ws-spin{to{transform:rotate(360deg)}}
@keyframes ws-drift{from{transform:translateX(-10px)}to{transform:translateX(14px)}}
@keyframes ws-zz{0%{opacity:0;transform:translate(-14px,22px) scale(.6)}25%,60%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(14px,-22px) scale(1.1)}}
@keyframes ws-flash{0%{opacity:0;transform:scale(.6)}30%{opacity:.95}100%{opacity:0;transform:scale(1.5)}}
@keyframes ws-wink{0%,100%{transform:scaleY(1)}45%,60%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){.ws-owl *{animation:none!important;transition:none!important}svg:hover .owl-hover{transform:none}}
</style><defs><linearGradient id="ws-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22336F"/><stop offset="1" stop-color="#121D45"/></linearGradient><linearGradient id="ws-dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3473"/><stop offset=".55" stop-color="#7C5C9E"/><stop offset="1" stop-color="#F2A877"/></linearGradient><linearGradient id="ws-day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD6F4"/><stop offset="1" stop-color="#FDF0D8"/></linearGradient><radialGradient id="ws-moon" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#FFF4D2"/><stop offset="1" stop-color="#F1D88E"/></radialGradient><radialGradient id="ws-sun" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#FFFDF2"/><stop offset="1" stop-color="#FFE59A"/></radialGradient><radialGradient id="ws-halo" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#F8E7B0" stop-opacity=".22"/><stop offset="1" stop-color="#F8E7B0" stop-opacity="0"/></radialGradient><radialGradient id="ws-sunhalo" cx=".5" cy=".5" r=".5"><stop offset=".5" stop-color="#FFF3C2" stop-opacity=".7"/><stop offset="1" stop-color="#FFF3C2" stop-opacity="0"/></radialGradient><radialGradient id="ws-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFC94D" stop-opacity=".95"/><stop offset="1" stop-color="#FFC94D" stop-opacity="0"/></radialGradient><linearGradient id="ws-meteor" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="70" y2="-28"><stop offset="0" stop-color="#FFF6D8"/><stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/></linearGradient><clipPath id="ws-tile"><rect width="512" height="512" rx="114"/></clipPath><clipPath id="ws-perch"><rect width="512" height="436"/></clipPath></defs><g clip-path="url(#ws-tile)"><rect width="512" height="512" fill="url(#ws-night)"/><rect class="sky-dusk" width="512" height="512" fill="url(#ws-dusk)"/><rect class="sky-day" width="512" height="512" fill="url(#ws-day)"/><g class="sun"><circle cx="256" cy="232" r="214" fill="url(#ws-sunhalo)"/><g class="rays"><rect x="252" y="46" width="8" height="26" rx="4" fill="#FFE7A0" transform="rotate(0 256 232)"/><rect x="252" y="46" width="8" height="26" rx="4" fill="#FFE7A0" transform="rotate(30 256 232)"/><rect x="252" y="46" width="8" height="26" rx="4" fill="#FFE7A0" transform="rotate(60 256 232)"/><rect x="252" y="46" width="8" height="26" rx="4" fill="#FFE7A0" transform="rotate(90 256 232)"/><rect x="252" y="46" width="8" height="26" rx="4" fill="#FFE7A0" transform="rotate(120 256 232)"/><rect x="252" y="46" width="8" height="26" rx="4" fill="#FFE7A0" transform="rotate(150 256 232)"/><rect x="252" y="46" width="8" height="26" rx="4" fill="#FFE7A0" transform="rotate(180 256 232)"/><rect x="252" y="46" width="8" height="26" rx="4" fill="#FFE7A0" transform="rotate(210 256 232)"/><rect x="252" y="46" width="8" height="26" rx="4" fill="#FFE7A0" transform="rotate(240 256 232)"/><rect x="252" y="46" width="8" height="26" rx="4" fill="#FFE7A0" transform="rotate(270 256 232)"/><rect x="252" y="46" width="8" height="26" rx="4" fill="#FFE7A0" transform="rotate(300 256 232)"/><rect x="252" y="46" width="8" height="26" rx="4" fill="#FFE7A0" transform="rotate(330 256 232)"/></g><circle cx="256" cy="232" r="140" fill="url(#ws-sun)"/></g><g class="moon"><circle class="halo" cx="256" cy="232" r="214" fill="url(#ws-halo)"/><circle cx="256" cy="232" r="150" fill="url(#ws-moon)"/><circle cx="330" cy="168" r="16" fill="#EBCF84" opacity=".45"/><circle cx="364" cy="214" r="9" fill="#EBCF84" opacity=".4"/><circle cx="168" cy="190" r="11" fill="#EBCF84" opacity=".35"/></g><g class="stars"><g class="st" style="--d:.55s"><path class="star s1" d="M96 122l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#F8E7B0"/></g><g class="st" style="--d:.8s"><path class="star s2" d="M418 98l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#F8E7B0"/></g><g class="st" style="--d:1.05s"><circle class="star s3" cx="164" cy="64" r="3.5" fill="#F8E7B0"/></g><g class="st" style="--d:1.25s"><circle class="star s4" cx="452" cy="206" r="3" fill="#F8E7B0"/></g><g class="st" style="--d:1.45s"><circle class="star s5" cx="62" cy="262" r="2.6" fill="#F8E7B0"/></g></g><g class="meteor-wrap"><g transform="translate(262 44)"><path class="meteor" d="M0 0L70 -28" stroke="url(#ws-meteor)" stroke-width="3.5" stroke-linecap="round"/></g></g><g class="clouds"><g class="cloud-a"><path transform="translate(112 330) scale(1.05)" fill="#fff" opacity=".92" d="M-46 18c-14 0-22-8-22-18s9-18 21-18c4-15 16-24 31-24 15 0 27 9 31 22 3-1 6-2 9-2 14 0 24 9 24 20s-9 20-22 20z"/></g><g class="cloud-b"><path transform="translate(418 150) scale(0.8)" fill="#fff" opacity=".92" d="M-46 18c-14 0-22-8-22-18s9-18 21-18c4-15 16-24 31-24 15 0 27 9 31 22 3-1 6-2 9-2 14 0 24 9 24 20s-9 20-22 20z"/></g></g><g clip-path="url(#ws-perch)"><g class="owl-hover"><g class="owl-idle"><path class="owl-body" d="M184 150C212 170 236 178 256 178C276 178 300 170 328 150C342 186 350 218 348 252C372 296 376 360 344 398C320 426 290 434 256 434C222 434 192 426 168 398C136 360 140 296 164 252C162 218 170 186 184 150Z" stroke-width="12" stroke-linejoin="round"/><circle class="owl-ring" cx="216" cy="262" r="46"/><circle class="owl-ring" cx="296" cy="262" r="46"/><g class="glow-wrap"><ellipse class="glow" cx="256" cy="262" rx="120" ry="62" fill="url(#ws-glow)"/></g><ellipse class="flash" cx="256" cy="262" rx="150" ry="80" fill="url(#ws-glow)"/><g class="eye-state"><g class="eye"><g class="wink" data-eye="l"><circle cx="218" cy="262" r="30" fill="#FFB52E"/><g class="look"><g class="glance"><circle cx="222" cy="264" r="14" fill="#0E1838"/><circle cx="212" cy="254" r="6" fill="#FFF3C4"/></g></g></g></g></g><g class="eye-state"><g class="eye"><g class="wink" data-eye="r"><circle cx="294" cy="262" r="30" fill="#FFB52E"/><g class="look"><g class="glance"><circle cx="290" cy="264" r="14" fill="#0E1838"/><circle cx="284" cy="254" r="6" fill="#FFF3C4"/></g></g></g></g></g><path class="sleep-eye" d="M196 262q22 18 44 0M272 262q22 18 44 0" fill="none" stroke="#C9D3F0" stroke-width="7" stroke-linecap="round"/><path d="M244 300H268L256 322Z" fill="#E59A2F" stroke="#E59A2F" stroke-width="8" stroke-linejoin="round"/></g></g></g><g class="zzz"><g transform="translate(348 142) scale(1.1)"><path class="zz zz1" d="M0 0h16L0 18h16" fill="none" stroke="#3F4E7E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(378 104) scale(1.4)"><path class="zz zz2" d="M0 0h16L0 18h16" fill="none" stroke="#3F4E7E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(412 60) scale(1.7)"><path class="zz zz3" d="M0 0h16L0 18h16" fill="none" stroke="#3F4E7E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g><path class="branch" d="M72 446C168 428 330 426 440 438" fill="none" stroke-width="20" stroke-linecap="round"/><path class="branch" d="M376 432c14-14 30-22 48-24" fill="none" stroke-width="12" stroke-linecap="round"/></g></svg>
