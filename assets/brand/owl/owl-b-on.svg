<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="ws-owl state-on" role="img" aria-label="World Science"><title>World Science</title><style>
.ws-owl .owl-body{fill:#0E1838;stroke:#0E1838}.ws-owl .owl-ring{fill:#1F2C57}.ws-owl .branch{stroke:#0E1838}
.ws-owl .sky-dusk,.ws-owl .sky-day,.ws-owl .sun,.ws-owl .clouds,.ws-owl .zzz,.ws-owl .sleep-eye,.ws-owl .flash{opacity:0}
.ws-owl .sun{transform:translateY(130px)}
.ws-owl .glow-wrap{opacity:.5}
.meteor{opacity:0}
.star,.eye-state,.glance,.eye,.wink,.zz,.flash{transform-box:fill-box;transform-origin:center}
.owl-idle,.owl-hover{transform-box:view-box;transform-origin:256px 430px}
.sun,.moon,.rays{transform-box:view-box;transform-origin:256px 232px}
.state-busy .sky-dusk{opacity:1}
.state-busy .sun{opacity:0;transform:translateY(130px)}
.state-busy .moon{opacity:.92;transform:translateY(70px)}
.state-busy .st{opacity:.45}
.state-busy .eye-state{transform:scaleY(.42)}
.state-busy .glow-wrap{opacity:.25}
.state-busy .owl-body{fill:#272B5C;stroke:#272B5C}.state-busy .owl-ring{fill:#363C74}.state-busy .branch{stroke:#272B5C}
.state-off .sky-day,.state-off .sun,.state-off .clouds,.state-off .zzz,.state-off .sleep-eye{opacity:1}
.state-off .sun{transform:none}
.state-off .moon{opacity:0;transform:translateY(110px)}
.state-off .st{transform:scale(.2)}
.state-off .st,.state-off .glow-wrap,.state-off .meteor-wrap{opacity:0}
.state-off .eye-state{transform:scaleY(.06);opacity:0}
.state-off .owl-body{fill:#4D5D8C;stroke:#4D5D8C}.state-off .owl-ring{fill:#5E70A3}.state-off .branch{stroke:#6A6F86}
